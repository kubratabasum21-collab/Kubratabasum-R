<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Signup Mini Project</title>

    <!-- INTERNAL CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 420px;
            margin: 80px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            color: #333;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #2575fc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #6a11cb;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body onload="checkUser()">

<!-- SIGNUP PAGE -->
<div class="container" id="signupPage">
    <h1>User Signup</h1>

    <form onsubmit="return signupUser()">
        <label>Full Name</label>
        <input type="text" id="name" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <button type="submit">Sign Up</button>
    </form>
</div>

<!-- WELCOME PAGE -->
<div class="container hidden" id="welcomePage">
    <h1 id="welcomeText"></h1>
    <p>You have successfully signed up to our website.</p>
    <button onclick="logoutUser()">Logout</button>
</div>

<!-- THANK YOU PAGE -->
<div class="container hidden" id="thankyouPage">
    <h1>Thank You!</h1>
    <p>Thank you for using our website.<br>We hope you visit again.</p>
    <button onclick="goToSignup()">Go to Signup</button>
</div>

<!-- INTERNAL JAVASCRIPT -->
<script>
    function signupUser() {
        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value;

        localStorage.setItem("username", name);
        localStorage.setItem("useremail", email);

        showWelcome();
        return false;
    }

    function checkUser() {
        let name = localStorage.getItem("username");
        if (name) {
            showWelcome();
        }
    }

    function showWelcome() {
        document.getElementById("signupPage").classList.add("hidden");
        document.getElementById("thankyouPage").classList.add("hidden");

        document.getElementById("welcomePage").classList.remove("hidden");
        document.getElementById("welcomeText").innerText =
            "Welcome, " + localStorage.getItem("username") + "!";
    }

    function logoutUser() {
        localStorage.clear();
        document.getElementById("welcomePage").classList.add("hidden");
        document.getElementById("thankyouPage").classList.remove("hidden");
    }

    function goToSignup() {
        document.getElementById("thankyouPage").classList.add("hidden");
        document.getElementById("signupPage").classList.remove("hidden");
    }
</script>

</body>
</html>
